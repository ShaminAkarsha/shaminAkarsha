name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: shaminAkarsha
          outputs: |
            assets/profile/snake.svg
            assets/profile/snake-dark.svg?palette=github-dark

      - name: Push snake animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: assets/profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
